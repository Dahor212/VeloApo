name: 🟠 Deploy Strava Worker

on:
  workflow_dispatch:          # spustí se ručně (vyber větev claude/github-folder-review-kacbl)
  push:
    paths: ['worker/**']
    branches: ['**']          # všechny větve

jobs:
  deploy:
    name: Cloudflare Worker
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      # ── 1. Checkout ────────────────────────────────────────────────────
      - uses: actions/checkout@v4

      # ── 2. Node.js ─────────────────────────────────────────────────────
      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Wrangler
        run: cd worker && npm install

      # ── 3. KV namespace ────────────────────────────────────────────────
      - name: Create or get KV namespace
        id: kv
        env:
          CF_TOKEN:   ${{ secrets.CF_API_TOKEN }}
          CF_ACCOUNT: ${{ secrets.CF_ACCOUNT_ID }}
        run: |
          LIST=$(curl -sf "https://api.cloudflare.com/client/v4/accounts/$CF_ACCOUNT/storage/kv/namespaces?per_page=100" \
            -H "Authorization: Bearer $CF_TOKEN")
          echo "API response: $LIST"

          KV_ID=$(echo "$LIST" | python3 -c "
          import sys, json
          d = json.load(sys.stdin)
          match = [n['id'] for n in d.get('result',[]) if n['title']=='veloapo-strava-kv']
          print(match[0] if match else '')
          " 2>/dev/null || echo "")

          if [ -z "$KV_ID" ]; then
            CREATE=$(curl -sf -X POST \
              "https://api.cloudflare.com/client/v4/accounts/$CF_ACCOUNT/storage/kv/namespaces" \
              -H "Authorization: Bearer $CF_TOKEN" \
              -H "Content-Type: application/json" \
              -d '{"title":"veloapo-strava-kv"}')
            echo "Create response: $CREATE"
            KV_ID=$(echo "$CREATE" | python3 -c "import sys,json; print(json.load(sys.stdin)['result']['id'])")
            echo "✅ KV namespace created: $KV_ID"
          else
            echo "✅ KV namespace exists: $KV_ID"
          fi

          echo "KV_ID=$KV_ID" >> "$GITHUB_OUTPUT"

      # ── 4. Patch wrangler.toml with real KV id ──────────────────────────
      - name: Patch wrangler.toml
        run: |
          KV_ID="${{ steps.kv.outputs.KV_ID }}"
          sed -i "s/REPLACE_WITH_YOUR_KV_NAMESPACE_ID/$KV_ID/g"         worker/wrangler.toml
          sed -i "s/REPLACE_WITH_YOUR_KV_PREVIEW_NAMESPACE_ID/$KV_ID/g" worker/wrangler.toml
          echo "=== wrangler.toml ==="
          cat worker/wrangler.toml

      # ── 5. Deploy Worker (oficiální Cloudflare action) ─────────────────
      - name: Deploy Worker
        id: deploy
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CF_API_TOKEN }}
          accountId: ${{ secrets.CF_ACCOUNT_ID }}
          workingDirectory: worker
          secrets: |
            STRAVA_CLIENT_ID
            STRAVA_CLIENT_SECRET
            PWA_ORIGIN
        env:
          STRAVA_CLIENT_ID:     ${{ secrets.STRAVA_CLIENT_ID }}
          STRAVA_CLIENT_SECRET: ${{ secrets.STRAVA_CLIENT_SECRET }}
          PWA_ORIGIN:           https://dahor212.github.io

      # ── 6. Zjisti Worker URL ───────────────────────────────────────────
      - name: Get Worker URL
        id: url
        env:
          CF_TOKEN:   ${{ secrets.CF_API_TOKEN }}
          CF_ACCOUNT: ${{ secrets.CF_ACCOUNT_ID }}
        run: |
          # Zjisti workers.dev subdomain
          RESP=$(curl -sf "https://api.cloudflare.com/client/v4/accounts/$CF_ACCOUNT/workers/subdomain" \
            -H "Authorization: Bearer $CF_TOKEN" || echo '{}')
          SUBDOMAIN=$(echo "$RESP" | python3 -c "import sys,json; d=json.load(sys.stdin); print(d.get('result',{}).get('subdomain',''))" 2>/dev/null || echo "")

          if [ -n "$SUBDOMAIN" ]; then
            WORKER_URL="https://veloapo-strava.${SUBDOMAIN}.workers.dev"
          else
            WORKER_URL="https://veloapo-strava.workers.dev"
          fi
          echo "WORKER_URL=$WORKER_URL" >> "$GITHUB_OUTPUT"
          echo "🚀 Worker URL: $WORKER_URL"

      # ── 7. Update app.js with real Worker URL ─────────────────────────
      - name: Update STRAVA_WORKER_URL in app.js
        run: |
          WORKER_URL="${{ steps.url.outputs.WORKER_URL }}"
          echo "Updating app.js → $WORKER_URL"
          sed -i "s|https://veloapo-strava\.[^']*|$WORKER_URL|g" app.js
          grep "STRAVA_WORKER_URL" app.js

      # ── 8. Commit updated app.js ───────────────────────────────────────
      - name: Commit app.js
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add app.js
          if git diff --cached --quiet; then
            echo "app.js already up to date"
          else
            git commit -m "chore: update Strava Worker URL in app.js [skip ci]"
            git push
          fi

      # ── 9. Summary ─────────────────────────────────────────────────────
      - name: Summary
        run: |
          echo "## ✅ Strava Worker nasazen!" >> "$GITHUB_STEP_SUMMARY"
          echo "**Worker URL:** ${{ steps.url.outputs.WORKER_URL }}" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "### Nastav v Strava app:" >> "$GITHUB_STEP_SUMMARY"
          echo "- **Authorization Callback Domain:** \`${{ steps.url.outputs.WORKER_URL }}\` (bez https://)" >> "$GITHUB_STEP_SUMMARY"
